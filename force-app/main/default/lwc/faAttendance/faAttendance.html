<template>
    <lightning-card title="Gestion des Présences" icon-name="standard:task2">
        <div class="slds-p-around_small">
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-box slds-text-align_center">
                        <p class="slds-text-heading_medium">{attendanceRate}%</p>
                        <p class="slds-text-body_small">Taux de Présence</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-box slds-text-align_center">
                        <p class="slds-text-heading_medium">{totalPresent}</p>
                        <p class="slds-text-body_small">Total Présences</p>
                    </div>
                </div>
            </div>
            <lightning-combobox label="Séance" value={selectedSession} options={sessions} onchange={handleSessionChange} class="slds-m-bottom_small"></lightning-combobox>
            <template if:true={selectedSession}>
                <lightning-datatable key-field="Id" data={attendance} columns={columns} hide-checkbox-column></lightning-datatable>
            </template>
        </div>
    </lightning-card>
</template>
