<template>
    <lightning-card title="Évaluations" icon-name="standard:calibration">
        <div class="slds-p-around_small">
            <template if:true={isLoading}><lightning-spinner alternative-text="Chargement..."></lightning-spinner></template>
            <template if:false={isLoading}>
                <lightning-datatable key-field="Id" data={evaluations} columns={columns} hide-checkbox-column sorted-by="Evaluation_Date__c" default-sort-direction="desc"></lightning-datatable>
            </template>
        </div>
    </lightning-card>
</template>
