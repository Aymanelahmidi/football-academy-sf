<template>
    <lightning-card title="Données GPS & Performance" icon-name="standard:location">
        <div class="slds-p-around_small">
            <div class="slds-grid slds-gutters slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-3">
                    <lightning-combobox label="Joueur" value={selectedPlayer} options={players} onchange={handlePlayerChange}></lightning-combobox>
                </div>
            </div>
            <!-- KPIs -->
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-text-align_center">
                        <p class="slds-text-heading_medium">{totalRecords}</p>
                        <p class="slds-text-body_small">Enregistrements</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-text-align_center">
                        <p class="slds-text-heading_medium">{avgDistance} km</p>
                        <p class="slds-text-body_small">Distance Moy.</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-text-align_center">
                        <p class="slds-text-heading_medium">{avgMaxSpeed} km/h</p>
                        <p class="slds-text-body_small">Vitesse Max Moy.</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-text-align_center">
                        <p class="slds-text-heading_medium">{avgSprints}</p>
                        <p class="slds-text-body_small">Sprints Moy.</p>
                    </div>
                </div>
            </div>
            <template if:true={isLoading}><lightning-spinner alternative-text="Chargement..."></lightning-spinner></template>
            <template if:false={isLoading}>
                <lightning-datatable key-field="Id" data={gpsRecords} columns={columns} hide-checkbox-column sorted-by="Record_Date__c" default-sort-direction="desc"></lightning-datatable>
            </template>
        </div>
    </lightning-card>
</template>
