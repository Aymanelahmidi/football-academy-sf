<template>
    <lightning-card title="Matchs" icon-name="standard:goals">
        <lightning-button label="Nouveau Match" variant="brand" slot="actions" onclick={handleNewMatch}></lightning-button>
        <div class="slds-p-around_small">
            <div class="slds-grid slds-gutters slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-3">
                    <lightning-combobox label="Catégorie" value={selectedCategory} options={categories} onchange={handleCategoryChange}></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <lightning-combobox label="Statut" value={selectedStatus} options={statusOptions} onchange={handleStatusChange}></lightning-combobox>
                </div>
            </div>
            <template if:true={isLoading}><lightning-spinner alternative-text="Chargement..."></lightning-spinner></template>
            <template if:false={isLoading}>
                <lightning-datatable key-field="Id" data={matches} columns={columns} hide-checkbox-column></lightning-datatable>
            </template>
        </div>
    </lightning-card>
</template>
