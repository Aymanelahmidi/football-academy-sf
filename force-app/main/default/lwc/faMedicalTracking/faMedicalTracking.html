<template>
    <lightning-card title="Suivi Médical" icon-name="standard:medicine">
        <div class="slds-p-around_small">
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-text-align_center">
                        <p class="slds-text-heading_medium slds-text-color_error">{activeInjuries}</p>
                        <p class="slds-text-body_small">Blessures Actives</p>
                    </div>
                </div>
            </div>
            <div class="slds-grid slds-gutters slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-3">
                    <lightning-combobox label="Statut" value={selectedStatus} options={statusOptions} onchange={handleStatusChange}></lightning-combobox>
                </div>
            </div>
            <template if:true={isLoading}><lightning-spinner alternative-text="Chargement..."></lightning-spinner></template>
            <template if:false={isLoading}>
                <lightning-datatable key-field="Id" data={injuries} columns={columns} hide-checkbox-column></lightning-datatable>
            </template>
        </div>
    </lightning-card>
</template>
