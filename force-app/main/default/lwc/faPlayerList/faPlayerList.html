<template>
    <lightning-card title="Effectif" icon-name="standard:people">
        <lightning-button label="Nouveau Joueur" variant="brand" slot="actions"
            onclick={handleNewPlayer}></lightning-button>

        <div class="slds-p-around_small">
            <!-- Filters -->
            <div class="slds-grid slds-gutters slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-3">
                    <lightning-combobox label="Catégorie" value={selectedCategory}
                        options={categories} onchange={handleCategoryChange}></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <lightning-combobox label="Statut" value={selectedStatus}
                        options={statusOptions} onchange={handleStatusChange}></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <lightning-input type="search" label="Rechercher" placeholder="Nom du joueur..."
                        value={searchTerm} onchange={handleSearch}></lightning-input>
                </div>
            </div>

            <p class="slds-m-bottom_small slds-text-body_small">{totalPlayers} joueur(s) trouvé(s)</p>

            <!-- Data Table -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Chargement..."></lightning-spinner>
            </template>
            <template if:false={isLoading}>
                <lightning-datatable key-field="Id" data={players} columns={columns}
                    onrowaction={handleRowAction} hide-checkbox-column
                    show-row-number-column></lightning-datatable>
            </template>
        </div>
    </lightning-card>
</template>
